[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "primeshift"
dynamic = ["version"]
description = "One-hotkey display layout switcher for Windows multi-monitor + KVM setups"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.scripts]
primeshift = "primeshift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "primeshift.__version__" }
